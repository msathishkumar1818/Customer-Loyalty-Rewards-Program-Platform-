<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal Login | PerkPulse Retail Loyalty & Rewards SaaS</title>
  <meta name="description"
    content="Log in to PerkPulse to manage your retail rewards program, cash registers, member tiers, and live store telemetry.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'></polygon></svg>">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body class="bg-body text-main transition-colors duration-200">

  <!-- Top Sticky Header Navigation -->
  <header class="site-header" id="mainHeader">
    <div class="header-container">

      <!-- Brand Logo -->
      <a href="index.html" class="brand-link" aria-label="PerkPulse Homepage">
        <div class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon
              points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
            </polygon>
          </svg>
        </div>
        <div class="brand-meta">
          <span class="brand-title">PerkPulse</span>
          <span class="brand-tagline">Retail Loyalty SaaS</span>
        </div>
      </a>


      <!-- Desktop Actions: RTL/LTR, Dark Mode, Home, CTA Button -->
      <div class="header-actions">
        <!-- RTL/LTR Toggle -->
        <button type="button" class="action-icon-btn js-rtl-toggle desktop-utility-actions" title="Toggle RTL/LTR"
          aria-label="Toggle Text Direction">
          <span class="rtl-label-text font-bold text-xs tracking-wider">RTL</span>
        </button>

        <!-- Dark Mode Toggle -->
        <button type="button" class="action-icon-btn js-theme-toggle desktop-utility-actions"
          title="Toggle Dark/Light Mode" aria-label="Toggle Dark Mode">
          <svg class="theme-icon-sun hidden dark:block" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon-moon block dark:hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- Home Quick Link -->
        <a href="index.html" class="action-icon-btn desktop-utility-actions" title="Back to Homepage"
          aria-label="Back to Homepage">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </a>

        <!-- Header CTA Button -->
        <a href="pricing.html" class="header-cta-btn" id="headerCtaBtn">
          <span>Get Started</span>
          <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>

        <!-- Mobile Menu Toggle Button -->
        <button type="button" class="mobile-toggle-btn" id="mobileMenuOpenBtn" aria-label="Open Mobile Navigation Menu"
          aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>

    </div>
  </header>



  <!-- Main Login Showcase Page -->
  <main class="login-page-wrapper" id="main-content">

    <!-- Cinematic Background Image (Full-Bleed Reference Model) -->
    <img src="assets/images/hero/home2-hero-full-bg.jpg"
      alt="Retail loyalty shoppers and modern omnichannel retail store checkout" class="login-hero-bg" loading="eager">

    <!-- Subtle Radial Blur & Contrast Overlay -->
    <div class="login-hero-overlay"></div>

    <!-- Centered Floating Card Container -->
    <div class="login-card-container">

      <!-- The Floating Auth Card (Matches the Reference Image Design) -->
      <div class="login-floating-card">

        <!-- Top Eyebrow Badge (Two colored dots + Guest/Merchant login) -->
        <div class="login-badge-pill">
          <span class="login-badge-dots">
            <span class="login-badge-dot"></span>
            <span class="login-badge-dot"></span>
          </span>
          <span>Merchant Portal</span>
        </div>

        <!-- Heading & Subtitle -->
        <h1 class="login-card-title">Good to see you again</h1>
        <p class="login-card-subtitle">Log in to manage your loyalty program &amp; registers.</p>

        <!-- Social SSO Buttons (Google & Apple side-by-side) -->
        <div class="login-social-grid">
          <!-- Google Button -->
          <button type="button" class="login-social-btn" id="googleLoginBtn" aria-label="Sign in with Google">
            <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4" />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853" />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                fill="#FBBC05" />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                fill="#EA4335" />
            </svg>
            <span>Google</span>
          </button>

          <!-- Apple Button -->
          <button type="button" class="login-social-btn" id="appleLoginBtn" aria-label="Sign in with Apple">
            <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.64-.78 1.08-1.86.96-2.95-1 .04-2.14.65-2.81 1.43-.59.68-1.11 1.77-.97 2.83 1.11.09 2.18-.53 2.82-1.31z" />
            </svg>
            <span>Apple</span>
          </button>
        </div>

        <!-- Divider (or use your email) -->
        <div class="login-divider">
          <span>or use your email</span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">

          <!-- Email Input -->
          <div>
            <label for="loginEmail" class="login-input-label">Email</label>
            <input type="email" id="loginEmail" class="login-input" placeholder="you@example.com" required>
          </div>

          <!-- Password Input -->
          <div>
            <label for="loginPassword" class="login-input-label">Password</label>
            <div class="login-input-wrapper">
              <input type="password" id="loginPassword" class="login-input pr-11" placeholder="Enter your password"
                required>
              <button type="button" class="login-password-toggle" id="togglePasswordBtn"
                aria-label="Toggle password visibility">
                <!-- Eye Open Icon -->
                <svg id="eyeOpenIcon" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <!-- Eye Slash Icon (hidden by default) -->
                <svg id="eyeSlashIcon" class="w-4 h-4 hidden" xmlns="http://www.w3.org/2000/svg" fill="none"
                  viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Options Row: Keep me logged in + Forgot password? -->
          <div class="flex items-center justify-between text-xs pt-1">
            <label
              class="flex items-center gap-2 cursor-pointer select-none text-neutral-600 dark:text-neutral-300 font-medium">
              <input type="checkbox" id="keepLoggedInCheckbox" checked
                class="w-4 h-4 rounded text-indigo-600 border-slate-300 dark:border-neutral-700 focus:ring-indigo-500 cursor-pointer">
              <span>Keep me logged in</span>
            </label>
            <a href="contact.html" class="font-bold text-rose-700 dark:text-rose-400 hover:underline">
              Forgot password?
            </a>
          </div>

          <!-- Log in Primary Submit Button -->
          <div class="pt-2">
            <button type="submit" class="login-primary-btn" id="loginSubmitBtn">
              Log in
            </button>
          </div>

        </form>

        <!-- Bottom Link (New here? Create a free account) -->
        <div class="text-center text-xs text-neutral-600 dark:text-neutral-400 mt-6 font-medium">
          New here? <a href="pricing.html"
            class="font-bold text-rose-700 dark:text-rose-400 underline hover:opacity-80">Create a free account</a>
        </div>

      </div>

    </div>

  </main>


  <!-- Scripts -->
  <script src="assets/js/main.js"></script>
  <script>
    // Password Visibility Toggle
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('loginPassword');
    const eyeOpenIcon = document.getElementById('eyeOpenIcon');
    const eyeSlashIcon = document.getElementById('eyeSlashIcon');

    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        if (eyeOpenIcon && eyeSlashIcon) {
          eyeOpenIcon.classList.toggle('hidden', isPassword);
          eyeSlashIcon.classList.toggle('hidden', !isPassword);
        }
      });
    }

    // Login Form Submit Handling
    const loginForm = document.getElementById('loginForm');
    const loginSubmitBtn = document.getElementById('loginSubmitBtn');

    if (loginForm) {
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (loginSubmitBtn) {
          loginSubmitBtn.disabled = true;
          loginSubmitBtn.innerHTML = `
            <span class="inline-flex items-center gap-2">
              <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Authenticating...</span>
            </span>
          `;
        }
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);
      });
    }

    // Social Button Click Handlers
    const googleBtn = document.getElementById('googleLoginBtn');
    const appleBtn = document.getElementById('appleLoginBtn');

    [googleBtn, appleBtn].forEach((btn) => {
      if (btn) {
        btn.addEventListener('click', () => {
          window.location.href = 'dashboard.html';
        });
      }
    });
  </script>
</body>

</html>
